<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- cream background -->
  <rect width="1200" height="630" fill="#FBF3E4"/>
  <!-- subtle top band -->
  <rect width="1200" height="10" fill="#D7263D"/>

  <!-- left: copy -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="80" y="96" width="336" height="46" rx="23" fill="#FFFFFF" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="112" cy="119" r="7" fill="#00B14F"/>
      <text x="132" y="126" font-size="19" font-weight="700" fill="#3E2C23">POS + Omnichannel F&amp;B</text>
    </g>
    <text x="80" y="230" font-size="72" font-weight="900" fill="#3E2C23">Banyak pintunya,</text>
    <text x="80" y="316" font-size="72" font-weight="900" fill="#3E2C23">satu dapurnya.</text>
    <rect x="80" y="352" width="330" height="34" rx="8" fill="#FFC53D"/>
    <text x="100" y="376" font-size="22" font-weight="800" fill="#3E2C23">POS kasir gratis selamanya</text>
    <text x="80" y="448" font-size="24" fill="#6B5142">Satu layar untuk GrabFood, GoFood,</text>
    <text x="80" y="482" font-size="24" fill="#6B5142">ShopeeFood &amp; dine-in. Auto-print dapur.</text>
    <!-- platform chips -->
    <g>
      <rect x="80" y="522" width="150" height="42" rx="21" fill="#FFFFFF" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="108" cy="543" r="7" fill="#00B14F"/>
      <text x="126" y="550" font-size="17" font-weight="700" fill="#3E2C23">GrabFood</text>
      <rect x="246" y="522" width="146" height="42" rx="21" fill="#FFFFFF" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="274" cy="543" r="7" fill="#00AA13"/>
      <text x="292" y="550" font-size="17" font-weight="700" fill="#3E2C23">GoFood</text>
      <rect x="408" y="522" width="176" height="42" rx="21" fill="#FFFFFF" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="436" cy="543" r="7" fill="#EE4D2D"/>
      <text x="454" y="550" font-size="17" font-weight="700" fill="#3E2C23">ShopeeFood</text>
    </g>
  </g>

  <!-- right: order card (diner style) -->
  <g>
    <rect x="700" y="130" width="420" height="380" rx="24" fill="#FFFFFF" stroke="#3E2C23" stroke-width="4"/>
    <rect x="706" y="136" width="420" height="380" rx="24" fill="none" stroke="#3E2C23" stroke-width="0"/>
    <!-- header -->
    <text x="736" y="186" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#3E2C23">Semua pesanan, satu layar</text>
    <rect x="1046" y="166" width="46" height="26" rx="6" fill="#FBF3E4" stroke="#3E2C23" stroke-width="2"/>
    <text x="1054" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E2C23">10:24</text>
    <line x1="700" y1="210" x2="1120" y2="210" stroke="#3E2C23" stroke-width="2"/>
    <!-- order rows -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="728" y="232" width="364" height="76" rx="14" fill="#FBF3E4" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="762" cy="270" r="16" fill="#00B14F"/>
      <text x="762" y="276" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">G</text>
      <text x="792" y="264" font-size="18" font-weight="800" fill="#3E2C23">GrabFood #1042</text>
      <text x="792" y="290" font-size="15" fill="#6B5142">2× Ayam Geprek, 1× Es Teh</text>
      <rect x="1002" y="252" width="74" height="30" rx="8" fill="#D7263D"/>
      <text x="1039" y="272" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">DAPUR</text>

      <rect x="728" y="324" width="364" height="76" rx="14" fill="#FFFFFF" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="762" cy="362" r="16" fill="#00AA13"/>
      <text x="762" y="368" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">G</text>
      <text x="792" y="356" font-size="18" font-weight="800" fill="#3E2C23">GoFood #2301</text>
      <text x="792" y="382" font-size="15" fill="#6B5142">1× Nasi Padang Rendang</text>
      <rect x="1002" y="344" width="74" height="30" rx="8" fill="#3E2C23"/>
      <text x="1039" y="364" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">DAPUR</text>

      <rect x="728" y="416" width="364" height="76" rx="14" fill="#FBF3E4" stroke="#3E2C23" stroke-width="3"/>
      <circle cx="762" cy="454" r="16" fill="#EE4D2D"/>
      <text x="762" y="460" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>
      <text x="792" y="448" font-size="18" font-weight="800" fill="#3E2C23">ShopeeFood #871</text>
      <text x="792" y="474" font-size="15" fill="#6B5142">3× Dimsum, 2× Es Jeruk</text>
      <rect x="1002" y="436" width="74" height="30" rx="8" fill="#D7263D"/>
      <text x="1039" y="456" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">DAPUR</text>
    </g>
  </g>

  <!-- bottom right: red CTA pill -->
  <g>
    <rect x="700" y="540" width="290" height="52" rx="26" fill="#D7263D" stroke="#3E2C23" stroke-width="3"/>
    <text x="845" y="573" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Mulai Gratis →</text>
  </g>
</svg>
